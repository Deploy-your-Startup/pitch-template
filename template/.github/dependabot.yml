version: 2
# Batch routine updates monthly; security updates and automatic rebases stay enabled.
updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 2
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 2
    directory: /
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # deploy.yml pins the shared deployment workflows to a release commit
      # of Deploy-your-Startup/deploy. `startup update` moves that pin together
      # with the project's other shared references, so Dependabot must not
      # bump it on its own.
      - dependency-name: "Deploy-your-Startup/deploy/*"
