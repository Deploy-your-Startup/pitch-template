name: Deploy

on:
  pull_request:
    paths: ["frontend/**", "e2e_tests/**", ".dockerignore", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "e2e_tests/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  browser:
    uses: §§deploy_your_startup.github_username§§/deploy-your-startup/.github/workflows/container-e2e.yml@main
    with:
      shards: 1
  deploy:
    needs: browser
    if: github.event_name != 'pull_request'
    uses: §§deploy_your_startup.github_username§§/deploy-your-startup/.github/workflows/deploy-pages.yml@main
    with:
      project_name: §§deploy_your_startup.project_name§§
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
