name: Deploy

on:
  pull_request:
    paths: ["frontend/**", "e2e_tests/**", ".dockerignore", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "e2e_tests/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Superseded PR checks can stop; pushes and manual deployments keep independent runs.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

jobs:
  browser:
    uses: §§deploy_your_startup.deploy_repository§§/.github/workflows/container-e2e.yml@§§deploy_your_startup.deploy_ref§§
    with:
      run_e2e: false
      shards: 1
  deploy:
    needs: browser
    if: github.event_name != 'pull_request'
    uses: §§deploy_your_startup.deploy_repository§§/.github/workflows/deploy-pages.yml@§§deploy_your_startup.deploy_ref§§
    with:
      project_name: §§deploy_your_startup.project_name§§
      # Public repositories deploy through the main-only production environment;
      # private ones use repository secrets (environments there need a paid plan).
      environment: ${{ github.event.repository.visibility == 'public' && 'production' || '' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
