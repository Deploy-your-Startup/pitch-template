version: 2
# Batch routine updates monthly; security updates and automatic rebases stay enabled.
updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 2
    directory: /template/frontend
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 2
    directories:
      - /
      - /template
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
