version: 2
updates:
  - package-ecosystem: npm
    directory: /template/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"

  # Actions are pinned to commit SHAs; Dependabot keeps the SHAs and their tag comments current.
  - package-ecosystem: github-actions
    directories:
      - /
      - /template
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
