version: 2
updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 2
    directory: /template/frontend
    schedule:
      interval: weekly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 2
    directories:
      - /
      - /template
    schedule:
      interval: weekly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
