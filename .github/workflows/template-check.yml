name: Check generated pitch project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Test standalone agent instructions and core ADRs
        run: bash tests/agent_instructions_test.sh
      - name: Follow every relative link in the template's Markdown
        run: python3 tests/test_agent_links_integration.py
      - name: Render the project
        run: >-
          uv run --no-project --with copier==9.18.2 copier copy
          --defaults --vcs-ref HEAD
          --data project_name=template-check
          --data base_domain=example.com
          --data github_username=example
          . ../generated
      - name: Check that agent instructions ship with the project
        working-directory: ../generated
        run: |
          test -s AGENTS.md
          test ! -e CLAUDE.md
          test -f .github/git-commit-instructions.md
          adrs=$(grep -o 'docs/architecture/[^)]*\.md' AGENTS.md)
          test -n "$adrs"
          for adr in $adrs; do test -f "$adr" || { echo "missing $adr"; exit 1; }; done
      - name: Check that deploys use the main-only production environment
        working-directory: ../generated
        run: grep -qx '      environment: production' .github/workflows/deploy.yml
      - name: Reject unresolved placeholders
        run: "! grep -rn '§§' ../generated"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the generated site
        working-directory: ../generated
        run: ./make.sh build
      - name: Check the rendered page
        working-directory: ../generated/frontend/dist
        run: |
          grep -q '<title>template-check — Coming Soon</title>' index.html
          grep -q 'example.com' index.html

  container-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: bash tests/container_e2e_test.sh
